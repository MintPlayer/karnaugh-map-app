name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # The Playwright image for the installed @playwright/test, read from the
  # lockfile (package.json holds only a range). Its browsers AND their OS
  # libraries are baked in, so `main` never runs `playwright install
  # --with-deps`: that step is what broke when ubuntu-latest moved to 26.04
  # (issue #4). A Playwright bump moves the image with it.
  playwright-image:
    name: playwright image
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Resolve the image
        id: version
        run: |
          version=$(jq -er '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "image=mcr.microsoft.com/playwright:v$version-noble" >> "$GITHUB_OUTPUT"

  # Keep this job's name: `main` is the check the merge-queue bot waits for.
  # It runs inside the Playwright image; uid 1001 is the runner's own user, so
  # the checked-out workspace stays writable.
  main:
    needs: playwright-image
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution, and replace "e2e" with "e2e-ci" in the command below
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Build first to ensure dist folders exist for typecheck
      - run: npx nx run-many -t build
      # Run lint, test, typecheck
      - run: npx nx run-many -t lint test typecheck
      # Run e2e tests sequentially to avoid port conflicts and daemon issues
      - run: npx nx run-many -t e2e --parallel=1
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
